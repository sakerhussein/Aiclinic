<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* ---- copied from booking/client/src/styles.css (the live Booking app) ---- */
:root{
  --ink:#0A0F14;--ink-2:#121A21;--ink-3:#1E2A33;--ink-line:#2A3640;--on-ink:#E8EEF0;--on-ink-muted:#93A3AD;
  --paper:#F2F4F3;--text:#0A0F14;--muted:#4B5863;--rule:#C9D6D2;--rule-soft:#E1E6E4;--field:#8A99A3;
  --accent:#2EE6B5;--accent-ink:#0B7A64;--accent-tint:#DDF7EE;--amber:#FFB23E;--amber-tint:#FFF0D6;--error:#B42318;--error-tint:#FDE7E4;
  --font-display:"Unbounded","Geist",system-ui,sans-serif;--font-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Menlo,monospace;--font-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.5 var(--font-body);overflow-x:clip}
html[lang="ar"] body,html[lang="ar"] button{font-family:var(--font-ar)}
h1,h2,h3,p{margin:0}
.display{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em}
html[lang="ar"] .display{font-family:var(--font-ar);font-weight:600}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate}
a{color:var(--accent-ink)}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:16px}
.bar{background:var(--ink);color:var(--on-ink)}
.bar .in{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding:6px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:17px;white-space:nowrap}
html[lang="ar"] .brand{font-family:var(--font-ar);font-weight:600}
.grow{flex:1}
.bar nav{display:flex;gap:4px;flex-wrap:wrap}
.bar nav a{color:var(--on-ink);text-decoration:none;padding:8px 12px;border-radius:999px;font-size:14px}
.bar nav a.on{background:var(--ink-3)}
.clinic{color:var(--on-ink-muted);font-size:13px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;color:var(--on-ink)}
.iconbtn.on{background:var(--ink-3)}
.linkbtn{color:var(--on-ink);padding:8px 12px;font-size:14px}
.um{display:inline-flex;align-items:center;gap:8px;color:var(--on-ink);background:var(--ink-3);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.page{padding:28px 16px;display:flex;flex-direction:column;gap:20px;max-width:1100px;margin-inline:auto}
.panel{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--ink)}
.btn-ink{background:var(--ink);color:#fff}
.btn-outline{border-color:var(--text);color:var(--text);background:transparent}
.btn-sm{min-height:38px;padding:0 16px;font-size:14px}
.btn-ghost{background:transparent;color:var(--accent-ink);border-color:var(--rule)}
.btn-xs{min-height:32px;padding:0 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font:inherit;cursor:pointer;text-decoration:underline}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.banner{padding:12px 14px;border-radius:14px;font-size:14px;border:1px solid}
.banner.ok{background:var(--accent-tint);border-color:var(--accent-ink);color:var(--accent-ink)}
.banner.warn{background:var(--amber-tint);border-color:var(--amber);color:#5c3700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--rule-soft);white-space:nowrap}
.pill.ok{background:var(--accent-tint);color:var(--accent-ink)}.pill.warn{background:var(--amber-tint);color:#8a5200}.pill.bad{background:var(--error-tint);color:var(--error)}
.stack{display:flex;flex-direction:column;gap:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--rule-soft);font-size:14px;vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
html[lang="ar"] th{letter-spacing:0;text-transform:none;font-size:13px}
.sec-h{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
html[lang="ar"] .sec-h{font-family:var(--font-ar);font-weight:600;letter-spacing:0;font-size:13px}
.nbox{display:block;width:100%;border:1px solid var(--field);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px;line-height:1.55;min-height:42px;color:var(--text);white-space:pre-wrap;text-align:start}
.note{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.note{grid-template-columns:1fr}}
.tx{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.signbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;border:1px solid var(--rule);border-radius:16px;background:#fff}
.setwrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
.settabs{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:8px}
.settabs button{display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;text-align:start;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--text)}
.settabs button.on{background:var(--ink);color:#fff}
.setbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.newtag{flex:none;font-size:10.5px;line-height:1.6;background:var(--accent);color:var(--ink);border-radius:999px;padding:0 7px;margin-inline-start:auto}
.sel{font-weight:400;min-height:46px;padding:0 14px;border:1px solid var(--field);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:space-between;color:var(--text)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--field);background:#fff;flex:none;display:grid;place-items:center}
.box.on{background:var(--accent-ink);border-color:var(--accent-ink)}
.box.on::after{content:"";width:9px;height:5px;border-inline-start:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
[dir="rtl"] .box.on::after{transform:translateY(-1px) rotate(45deg)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.phone{width:380px;max-width:100%;margin:0 auto;border:1px solid var(--rule);border-radius:28px;overflow:hidden;background:var(--paper)}

/* ---- new for the patient record ---- */
.chead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chead h1{font-size:30px}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:4px}
.alerts{display:flex;gap:8px;flex-wrap:wrap}
.alert{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:7px 12px;font-size:13.5px;font-weight:600;border:1px solid}
.alert.red{background:var(--error-tint);border-color:#F3B4AB;color:#7a1a12}
.alert.amb{background:var(--amber-tint);border-color:var(--amber);color:#5c3700}
.alert .k{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;opacity:.8}
html[lang="ar"] .alert .k{font-family:var(--font-ar);letter-spacing:0;text-transform:none;font-size:12px}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:0}
.ctabs a{padding:10px 14px;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ctabs a.on{color:var(--text);border-bottom-color:var(--accent-ink);font-weight:600}
.ctabs .n{font:500 11px var(--font-mono);background:var(--rule-soft);border-radius:999px;padding:0 6px;margin-inline-start:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.li{display:flex;justify-content:space-between;gap:10px;padding-block:7px;border-top:1px solid var(--rule-soft);font-size:14px}
.li:first-of-type{border-top:0}
.li .s{color:var(--muted);font-size:12.5px}
.en{direction:ltr;unicode-bidi:isolate;text-align:start}
.ai{border:1px solid #BFE9DB;background:#F6FDFA;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.ai .tag{font:600 11px var(--font-mono);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
html[lang="ar"] .ai .tag{font-family:var(--font-ar);letter-spacing:0;text-transform:none;font-size:12px}
.course{display:flex;gap:4px;direction:ltr}
.course i{flex:1;height:10px;border-radius:4px;background:var(--rule-soft)}
.course i.d{background:var(--accent-ink)}.course i.t{background:var(--accent)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:110px 26px minmax(0,1fr);gap:10px;align-items:start}
.tli .when{font:500 12.5px var(--font-mono);color:var(--muted);padding-top:12px;text-align:end}
html[lang="ar"] .tli .when{font-family:var(--font-ar);font-size:13px}
.tli .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.tli .rail::before{content:"";position:absolute;inset-block:0;width:2px;background:var(--rule)}
.tli .rail b{position:relative;margin-top:12px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--accent-ink);display:grid;place-items:center;font-size:12px}
.tli .what{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:10px 14px;margin-block:4px;display:flex;flex-direction:column;gap:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ph{border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#E9D8CC,#D9BFAE);aspect-ratio:3/4;position:relative;display:grid;place-items:center;color:#8C6A58}
.ph.b{background:linear-gradient(160deg,#E7D3C5,#CFAE9A)}
.ph .cap{position:absolute;inset-inline:0;bottom:0;background:rgba(10,15,20,.62);color:#fff;font-size:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rx{background:#fff;width:520px;max-width:100%;margin:0 auto;border:1px solid var(--rule);border-radius:6px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;font-size:14px;box-shadow:0 8px 30px rgba(10,15,20,.08)}
.rx .top{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.rx .sym{font:600 26px var(--font-display);color:var(--accent-ink)}
.rx ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
.rx .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-top:1px solid var(--rule);padding-top:10px;margin-top:8px}
.sigline{width:160px;border-bottom:1px solid var(--ink);height:34px;font-family:cursive;color:var(--accent-ink);font-size:20px;text-align:center}
.q{display:flex;flex-direction:column;gap:6px;font-size:14px}
.yn{display:flex;gap:6px}.yn span{flex:1;text-align:center;border:1px solid var(--field);border-radius:10px;padding:8px;background:#fff}.yn span.on{border:2px solid var(--accent-ink);background:#F6FDFA;font-weight:600}
.inp{border:1px solid var(--field);border-radius:12px;background:#fff;padding:10px 12px;font-size:14px;min-height:44px}
.pad{border:1px dashed var(--field);border-radius:12px;background:#fff;height:90px;display:grid;place-items:center;font-family:cursive;font-size:26px;color:var(--ink)}
.lock{display:flex;gap:12px;align-items:center;border:1px dashed var(--rule);border-radius:16px;padding:16px;background:#fff;color:var(--muted)}
.newbadge{font:600 10px var(--font-mono);background:var(--accent);color:var(--ink);border-radius:999px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.pr{font-size:12px;font-weight:600;color:#8a5200;background:var(--amber-tint);border-radius:999px;padding:1px 8px}
@media (max-width:820px){.setwrap{grid-template-columns:1fr}.settabs{flex-direction:row;overflow-x:auto}.settabs button{white-space:nowrap}.tli{grid-template-columns:76px 22px minmax(0,1fr)}}

/* ---- analysis ---- */
.an{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;margin-top:22px}
.an h2{font-size:20px}
.an h3{font-size:16px;margin-top:6px}
.an ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.src>div{border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.src b{font-size:15px}
.cmpt td,.cmpt th{font-size:13.5px}
.cmpt td:first-child{font-weight:600}
.y{color:var(--accent-ink);font-weight:600}.n{color:var(--muted)}
.ph-a{background:var(--accent);color:var(--ink)}.ph-b{background:#CFEFFF;color:#0b4a6b}.ph-c{background:var(--amber-tint);color:#8a5200}.ph-x{background:var(--rule-soft);color:var(--muted)}
.phase{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.phase>div{border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.phase ul{font-size:14px}
.dec{border:2px solid var(--accent-ink);background:#F6FDFA}
.arch{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.arch .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.node{border:1px solid var(--rule);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}
.node.acc{background:var(--ink);color:var(--on-ink);border-color:var(--ink);align-self:center;min-width:min(420px,100%);text-align:center}
.node.acc .hint{color:var(--on-ink-muted)}
.node.rec{border:2px solid var(--accent-ink);background:#F6FDFA}
.node.db{background:var(--paper)}
@media (max-width:620px){.arch .pair{grid-template-columns:1fr}}

/* ---- design page frame ---- */
.topnote{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--on-ink);border-bottom:1px solid var(--ink-3)}
.topnote .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:54px;flex-wrap:wrap;padding-block:6px}
.topnote span{color:var(--on-ink-muted);font-size:13px}
.lang-toggle{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--ink-line);background:transparent;color:var(--on-ink);font:inherit;cursor:pointer}
.idx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule)}
.idx b{font-size:12px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;margin-inline-end:4px}
.idx a{min-width:30px;height:30px;padding:0 8px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--text);text-decoration:none;display:inline-grid;place-items:center;font:500 13px var(--font-mono)}
.frame-title{margin-block:44px 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-family:var(--font-mono);font-weight:500}
html[lang="ar"] .frame-title{font-family:var(--font-ar);letter-spacing:0;font-size:15px;font-weight:600}
.frame-p{color:var(--muted);max-width:780px;margin-bottom:14px}
.shot{border-radius:20px;border:1px solid var(--rule);overflow:hidden;background:var(--paper)}
.scroll{overflow-x:auto}.scroll>.wide{min-width:960px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="loop" viewBox="0 0 40 20"><path d="M20 10 C16.6 5.5 13.2 2 8.8 2 A8 8 0 0 0 8.8 18 C13.2 18 16.6 14.5 20 10 C23.4 5.5 26.8 2 31.2 2 A8 8 0 0 1 38.4 12.9" fill="none" stroke="#2EE6B5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33.6" cy="17.2" r="1.8" fill="#2EE6B5"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="face" viewBox="0 0 60 80"><ellipse cx="30" cy="36" rx="19" ry="25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 36c-3 0-4 8 1 9M49 36c3 0 4 8-1 9M22 30h5M33 30h5M30 34v9l-3 2M24 52c4 3 8 3 12 0M18 68c2 6 22 6 24 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="topnote"><div class="wrap">
  <div><b style="font-family:var(--font-display);font-weight:500">Limitsiz Clinic</b> <span data-ar="ملف المريض الطبي · التحليل والتصميم · للموافقة">Patient record (EMR) · analysis and design · for approval</span></div>
  <button class="lang-toggle" id="lang">العربية</button>
</div></div>

<main class="wrap" style="padding-bottom:60px">
  <div class="idx"><b data-ar="المحتوى">Contents</b><a href="#an">A</a><a href="#e1">1</a><a href="#e2">2</a><a href="#e3">3</a><a href="#e4">4</a><a href="#e5">5</a><a href="#e6">6</a><a href="#e7">7</a><a href="#e8">8</a><a href="#e9">9</a><a href="#e10">10</a><a href="#e11">11</a><a href="#e12">12</a></div>
  <div id="out"></div>
</main>

<script>
(function(){
  var T=function(en,ar){return '<span data-ar="'+ar.replace(/"/g,'&quot;')+'">'+en+'</span>'};
  var NEW=function(){return '<span class="newbadge">'+T('new','جديد')+'</span>'};
  var Y='<span class="y">✓</span>', N='<span class="n">—</span>';
  function frame(id,n,h,p,inner,wide){return '<div class="frame-title" id="'+id+'">'+n+' · '+T(h[0],h[1])+'</div><p class="frame-p">'+T(p[0],p[1])+'</p><div class="shot'+(wide?' scroll':'')+'">'+(wide?'<div class="wide">'+inner+'</div>':inner)+'</div>'}
  // Records copies Booking's header (ui.tsx Layout): same brand, clinic name, gear, language and person menu; its own name and nav.
  function bar(who,app){
    var doc=who!=='sec';
    var nav=app==='booking'

   '<li>'+T('<b>Clinical content is for clinical staff.</b> A secretary sees details, bookings and whether forms are done, never allergies, notes or photos (as visit notes today). Each part is a permission tied to the person\'s role in Accounts.','<b>المحتوى الطبي للطاقم الطبي.</b> السكرتيرة ترى البيانات والمواعيد وهل اكتملت النماذج، لا الحساسية ولا الملاحظات ولا الصور (كملاحظات الزيارة اليوم). وكل جزء صلاحية مرتبطة بدور الشخص في الحسابات.')+'</li>'+
