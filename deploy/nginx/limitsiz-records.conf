# records.limitsiz.si: its own site, so the website, the agent, Accounts and Booking are not touched. certbot adds the https part.
server {
    listen 80;
    server_name records.limitsiz.si;
    client_max_body_size 51m;          # photos and documents, up to Settings' limit (at most 50 MB)

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
