[project]
name = "limitsiz-agent"
version = "0.1.0"
description = "Limitsiz Clinic WhatsApp booking agent"
requires-python = ">=3.12"
dependencies = [
  "anthropic==2.4.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.2.3",
  "python-multipart==0.0.33",
  "tzdata==2024.2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["limitsiz_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
